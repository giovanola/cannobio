name: Fetch A2 Gotthard Traffic Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch A2 traffic data from ASTRA
        env:
          OPENTRANSPORT_API_KEY: ${{ secrets.OPENTRANSPORT_API_KEY }}
          TRAFFIC_COUNTER_KEY:   ${{ secrets.TRAFFIC_COUNTER_KEY }}
        run: python3 fetch_traffic.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add traffic.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update traffic data [skip ci]"
            git push
          fi
